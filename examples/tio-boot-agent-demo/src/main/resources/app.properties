app.name=tio-boot-agent-demo
app.env=dev
server.port=8080

# Agent CLI executable; the AGENT_CLI_PATH environment variable also works.
agent.cli.path=
# Extra CLI flags as "--flag value" pairs, for example provider settings.
agent.cli.args=
# Working directory of the agent; defaults to the server's working directory.
agent.workspace=
agent.model=
# default, acceptEdits, plan, bypassPermissions or dontAsk
agent.permission.mode=default
# Rules that run without asking, comma separated, for example Read,Grep,Glob
agent.allowed.tools=Read,Grep,Glob
# Tools the server always refuses, comma separated
agent.denied.tools=Bash
agent.query.timeout.seconds=600
agent.max.sessions=8

# Bearer token for /api/**. Empty keeps the APIs open only when app.env=dev.
app.api.token=
